<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="MultiAI — one web app for multiple AI providers"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>MultiAI</title></head><body><main class="app"><header><div><h1>MultiAI</h1><p>Gemini • Groq • OpenRouter • Cerebras • Mistral • Together • SambaNova</p></div><button id="settingsBtn">⚙️</button></header><section class="toolbar"><select id="provider"><option>Auto</option><option>Gemini</option><option>Groq</option><option>OpenRouter</option><option>Cerebras</option><option>Mistral</option><option>Together AI</option><option>SambaNova</option></select><input id="model" placeholder="Model (auto)" autocomplete="off"><label class="toggle"><input type="checkbox" id="fallback" checked> Auto fallback</label></section><section id="chat" class="chat"><div class="empty">Ask a question to start.</div></section><form id="composer"><textarea id="prompt" rows="3" placeholder="Ask anything…"></textarea><button type="submit">Send</button></form><div id="status" class="status"></div></main><dialog id="settings"><h2>API keys</h2><p>Keys stay in this browser. They are not sent to a MultiAI server.</p><div id="keys"></div><button id="closeSettings">Done</button></dialog><script src="app.js"></script></body></html>
